schemas:
  registro_paciente_request:
    document_type:
      type: string
      required: true
    identification:
      type: string
      required: true
    first_name:
      type: string
      required: true
    second_name:
      type: string
      default: ""
    first_last_name:
      type: string
      required: true
    second_last_name:
      type: string
      default: ""
    birth_date:
      type: string
      required: true
    gender:
      type: string
      default: "M"
    address:
      type: string
      default: ""
    phone:
      type: string
      default: ""
    mobile:
      type: string
      required: true
    email:
      type: string
      required: true
    password_hash:
      type: string
      required: true
    verification_token:
      type: string
      required: true
    client_id:
      type: integer
      required: true

endpoints:
  "POST /api/v1/pacientes/registro":
    description: "Registra paciente y usuario mediante Stored Procedure."
    request:
      body: registro_paciente_request

    pipeline:
      - type: sql
        name: registrar
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_RegistrarPacienteWeb @Identificacion, @CodigoTipoDocumento, @Nombre1, @Nombre2, @Apellido1, @Apellido2, @FechaNacimiento, @Sexo, @Direccion, @Telefono, @Celular, @Email, @PasswordHash, @VerificationToken, @IdCliente"
        args:
          Identificacion: ctx.request.body.identification
          CodigoTipoDocumento: ctx.request.body.document_type
          Nombre1: ctx.request.body.first_name
          Nombre2: ctx.request.body.second_name
          Apellido1: ctx.request.body.first_last_name
          Apellido2: ctx.request.body.second_last_name
          FechaNacimiento: ctx.request.body.birth_date
          Sexo: ctx.request.body.gender
          Direccion: ctx.request.body.address
          Telefono: ctx.request.body.phone
          Celular: ctx.request.body.mobile
          Email: ctx.request.body.email
          PasswordHash: ctx.request.body.password_hash
          VerificationToken: ctx.request.body.verification_token
          IdCliente: ctx.request.body.client_id

      - type: respond
        status: 200
        body: steps.registrar.row

  "GET /api/v1/pacientes/{codigo_paciente}/citas":
    description: "Consulta el historial de citas paginado de un paciente."
    request:
      path:
        codigo_paciente:
          type: integer
          required: true
      query:
        id_cliente:
          type: integer
          required: true
        tipo:
          type: string
          default: "TODAS"
        page:
          type: integer
          default: 1
        page_size:
          type: integer
          default: 5

    pipeline:
      - type: sql
        name: consultar_citas_paciente
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_ConsultarCitasPaciente @CodigoPaciente, @IdCliente, @TipoConsulta, @PageNumber, @PageSize"
        args:
          CodigoPaciente: ctx.request.path.codigo_paciente
          IdCliente: ctx.request.query.id_cliente
          TipoConsulta: ctx.request.query.tipo
          PageNumber: ctx.request.query.page
          PageSize: ctx.request.query.page_size

      - type: respond
        status: 200
        body: steps.consultar_citas_paciente.rows