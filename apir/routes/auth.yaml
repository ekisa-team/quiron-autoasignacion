schemas:
  login_request:
    identificacion:
      type: string
      required: true
    codigo_tipo_documento:
      type: string
      required: true
    id_cliente:
      type: integer
      required: true

  change_password_request:
    patient_id:
      type: integer
      required: true
    client_id:
      type: integer
      required: true
    new_password_hash:
      type: string
      required: true
      min_length: 6

  solicitar_recuperacion_request:
    document_type:
      type: string
      required: true
    identification:
      type: string
      required: true
    email:
      type: string
      required: true
    reset_token:
      type: string
      required: true
    client_id:
      type: integer
      required: true

  restablecer_clave_token_request:
    token:
      type: string
      required: true
    new_password_hash:
      type: string
      required: true
    client_id:
      type: integer
      required: true

  verificar_email_request:
    token:
      type: string
      required: true
    client_id:
      type: integer
      required: true

  login_fallido_request:
    usuario_id:
      type: integer
      required: true

  login_exitoso_request:
    usuario_id:
      type: integer
      required: true

endpoints:
  "POST /api/v1/auth/login":
    description: "Valida credenciales e informacion del paciente para login."
    request:
      body: login_request

    pipeline:
      - type: sql
        name: consultar_paciente
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_ConsultarPacienteLogin @Identificacion, @CodigoTipoDocumento, @IdCliente"
        args:
          Identificacion: ctx.request.body.identificacion
          CodigoTipoDocumento: ctx.request.body.codigo_tipo_documento
          IdCliente: ctx.request.body.id_cliente

      - type: respond
        when: "steps.consultar_paciente.rows_affected == 0"
        status: 404
        body: problem(404, "Paciente no encontrado o credenciales no registradas")

      - type: respond
        status: 200
        body: steps.consultar_paciente.row

  "POST /api/v1/auth/cambiar-clave":
    description: "Actualiza contrasena en sesion activa."
    request:
      body: change_password_request

    pipeline:
      - type: sql
        name: cambiar_clave
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_CambiarClaveSesion @PatientId, @ClientId, @NewPasswordHash"
        args:
          PatientId: ctx.request.body.patient_id
          ClientId: ctx.request.body.client_id
          NewPasswordHash: ctx.request.body.new_password_hash

      - type: respond
        status: 200
        body:
          status: "success"
          message: "Contrasena actualizada exitosamente"

  "POST /api/v1/auth/solicitar-recuperacion":
    description: "Asigna token de recuperacion temporal."
    request:
      body: solicitar_recuperacion_request

    pipeline:
      - type: sql
        name: solicitar_token
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_SolicitarRecuperacionClave @Doc, @DocType, @Email, @Token, @ClientId"
        args:
          Doc: ctx.request.body.identification
          DocType: ctx.request.body.document_type
          Email: ctx.request.body.email
          Token: ctx.request.body.reset_token
          ClientId: ctx.request.body.client_id

      - type: respond
        when: "steps.solicitar_token.rows_affected == 0"
        status: 404
        body: problem(404, "Paciente no encontrado o los datos no coinciden.")

      - type: respond
        status: 200
        body:
          status: "success"
          email: steps.solicitar_token.row.CorreoPaciente
          identification: steps.solicitar_token.row.IdentificacionPaciente

  "POST /api/v1/auth/restablecer-clave":
    description: "Restablece contrasena con token."
    request:
      body: restablecer_clave_token_request

    pipeline:
      - type: sql
        name: restablecer
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_RestablecerClaveToken @Token, @NewPasswordHash, @ClientId"
        args:
          Token: ctx.request.body.token
          NewPasswordHash: ctx.request.body.new_password_hash
          ClientId: ctx.request.body.client_id

      - type: respond
        when: "steps.restablecer.rows_affected == 0"
        status: 400
        body: problem(400, "Token invalido o expirado")

      - type: respond
        status: 200
        body:
          status: "success"
          message: "Contrasena restablecida con exito"
          email: steps.restablecer.row.CorreoPaciente

  "POST /api/v1/auth/verificar-email":
    description: "Verifica email mediante token."
    request:
      body: verificar_email_request

    pipeline:
      - type: sql
        name: verificar_token
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_VerificarEmailToken @Token, @ClientId"
        args:
          Token: ctx.request.body.token
          ClientId: ctx.request.body.client_id

      - type: respond
        when: "steps.verificar_token.row.FilasAfectadas == 0"
        status: 400
        body: problem(400, "Token invalido o expirado")

      - type: respond
        status: 200
        body:
          status: "success"
          message: "Correo verificado exitosamente"

  "GET /api/v1/auth/validar-token-recuperacion":
    description: "Valida vigencia de token."
    request:
      query:
        token:
          type: string
          required: true
        identificacion:
          type: string
          required: true
        id_cliente:
          type: integer
          required: true

    pipeline:
      - type: sql
        name: comprobar_token
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_ValidarTokenRecuperacion @Token, @Doc, @ClientId"
        args:
          Token: ctx.request.query.token
          Doc: ctx.request.query.identificacion
          ClientId: ctx.request.query.id_cliente

      - type: respond
        status: 200
        body:
          valid: steps.comprobar_token.rows_affected > 0

  "POST /api/v1/auth/intento-fallido":
    description: "Incrementa los intentos fallidos de login atómicamente y bloquea la cuenta si llega a 5."
    request:
      body: login_fallido_request

    pipeline:
      - type: sql
        name: registrar_intento
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_RegistrarIntentoFallido @Id"
        args:
          Id: ctx.request.body.usuario_id

      - type: respond
        status: 200
        body: steps.registrar_intento.row

  "POST /api/v1/auth/login-exitoso":
    description: "Resetea intentos fallidos y actualiza la fecha tras login exitoso."
    request:
      body: login_exitoso_request

    pipeline:
      - type: sql
        name: registrar_exito
        connection: sqlserver.main
        query: "EXEC dbo.Proc_Aut_RegistrarLoginExitoso @Id"
        args:
          Id: ctx.request.body.usuario_id

      - type: respond
        status: 200
        body:
          success: true