name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/ekisa-team/quiron-autoasignacion/app

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push SvelteKit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/app.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  package-hcl-configs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package HCL configurations per client
        run: |
          mkdir -p dist-hcl
          for dir in hclapi/*/; do
            if [ -d "$dir" ]; then
              client=$(basename "$dir")
              tar -czf "dist-hcl/hcl-${client}.tar.gz" -C hclapi "$client"
            fi
          done

      - name: Upload HCL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-hcl-packages
          path: dist-hcl/*.tar.gz

  create-github-release:
    needs: [build-and-push-app, package-hcl-configs]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download HCL Artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-hcl-packages
          path: dist-hcl

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-hcl/*.tar.gz
          body: |
            ## Distribución de Versión v${{ steps.version.outputs.version }}

            ### Imagen Docker
            ```bash
            docker pull ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            docker pull ${{ env.APP_IMAGE }}:latest
            ```

            ### Paquetes HCL
            Las configuraciones actualizadas para los túneles locales de cada clínica se encuentran adjuntas en los activos de este release.
