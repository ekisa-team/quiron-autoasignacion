name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push SvelteKit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  package-apir-config:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package base APIR configuration
        run: |
          set -euo pipefail

          test -d apir/base

          mkdir -p dist-apir
          (
            cd apir/base
            zip -r "../../dist-apir/apir-base.zip" .
          )

      - name: Upload APIR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-apir-package
          path: dist-apir/apir-base.zip

  create-github-release:
    needs:
      - build-and-push-app
      - package-apir-config
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download APIR Artifact
        uses: actions/download-artifact@v4
        with:
          name: base-apir-package
          path: dist-apir

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist-apir/apir-base.zip
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Docker Image
            ```bash
            docker pull ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            docker pull ${{ env.APP_IMAGE }}:latest
            ```

            ### Base APIR Configuration
            The release includes the canonical base APIR configuration:

            `apir-base.zip`

            Client-specific configuration should be adapted locally from this base configuration.