name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push SvelteKit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  package-hcl-configs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package HCL configurations per client as ZIP
        run: |
          mkdir -p dist-hcl
          DEST_DIR="$(pwd)/dist-hcl"
          for dir in hclapi/*/; do
            if [ -d "$dir" ]; then
              client=$(basename "$dir")
              (cd "$dir" && zip -r "${DEST_DIR}/hcl-${client}.zip" .)
            fi
          done

      - name: Upload HCL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-hcl-packages
          path: dist-hcl/*.zip

  create-github-release:
    needs: [build-and-push-app, package-hcl-configs]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download HCL Artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-hcl-packages
          path: dist-hcl

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist-hcl/*.zip
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Docker Image
            ```bash
            docker pull ${{ env.APP_IMAGE }}:${{ steps.version.outputs.version }}
            docker pull ${{ env.APP_IMAGE }}:latest
            ```

            ### Client HCL Packages
            The updated HCL tunnel configuration packages for each clinic are attached below as downloadable ZIP archives.
